<!doctype html>
<!-- 콜봇 시연용 가상 결제 페이지 (실제 결제·개인정보 수집 없음) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>한화손보 | 미납 보험료 납부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --orange: #F37321;
    --orange-deep: #D9560B;
    --orange-soft: #FFF4EB;
    --orange-line: #F7CBA6;
    --ink: #1B1B1F;
    --ink-2: #5B5B66;
    --ink-3: #8A8A93;
    --line: #E9E9EE;
    --chip: #F3F4F6;
    --red: #E0341C;
    --page: #F4F5F7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  @media (min-width: 560px) {
    body { background: var(--page); }
    .app { box-shadow: 0 0 0 1px var(--line), 0 12px 40px rgba(20, 20, 30, .06); }
  }

  /* 상단 로고 */
  .top { height: 68px; display: flex; align-items: center; padding: 0 24px; }
  .logo { height: 38px; width: auto; display: block; }
  .logo-text { font-size: 20px; font-weight: 800; color: var(--orange); letter-spacing: -.02em; }

  main { flex: 1; display: flex; flex-direction: column; padding: 28px 24px 40px; }
  .step { display: none; }
  .step.is-active { display: flex; flex-direction: column; flex: 1; animation: fade .35s ease both; }

  /* 1페이지: 안내 문구 */
  .eyebrow { font-size: 13px; font-weight: 700; color: var(--orange-deep); margin-bottom: 12px; }
  h1 { font-size: 25px; line-height: 1.44; font-weight: 700; letter-spacing: -.025em; }

  /* 계약 카드 */
  .card {
    margin-top: 28px;
    background: var(--orange-soft);
    border: 1px solid var(--orange-line);
    border-radius: 18px;
    padding: 24px 22px 22px;
  }
  .badge {
    display: inline-block;
    background: #fff;
    color: var(--orange-deep);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 6px;
  }
  .product { margin-top: 16px; font-size: 21px; line-height: 1.4; font-weight: 700; letter-spacing: -.02em; }
  .rows { margin-top: 22px; display: grid; gap: 15px; }
  .rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 14.5px; }
  .rows dt { color: var(--ink-2); flex-shrink: 0; }
  .rows dd { font-weight: 600; text-align: right; }
  .rows dd.warn { color: var(--red); font-weight: 700; }
  .total {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--orange-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total span { font-size: 15px; font-weight: 700; }
  .total strong { font-size: 27px; font-weight: 800; color: var(--orange-deep); letter-spacing: -.02em; }
  .total em { font-style: normal; font-size: 18px; margin-left: 2px; }

  /* 결제 방법 */
  .section-title { margin-top: 36px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .section-sub { margin-top: 6px; font-size: 14px; color: var(--ink-3); }
  .methods { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .method {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 20px 6px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color .18s, background-color .18s, box-shadow .18s, transform .12s;
  }
  .method .ico {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--chip);
    color: var(--ink-2);
    display: grid;
    place-items: center;
    transition: background-color .18s, color .18s;
  }
  .method svg { width: 27px; height: 27px; }
  .method .label {
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.35;
    min-height: 2.7em;
    display: flex;
    align-items: center;
    text-align: center;
    transition: color .18s;
  }
  .method:hover,
  .method:focus-visible,
  .method.is-selected {
    border-color: var(--orange);
    background: var(--orange-soft);
    box-shadow: 0 6px 18px rgba(243, 115, 33, .18);
    outline: none;
  }
  .method:hover .ico,
  .method:focus-visible .ico,
  .method.is-selected .ico { background: var(--orange); color: #fff; }
  .method:hover .label,
  .method:focus-visible .label,
  .method.is-selected .label { color: var(--orange-deep); }
  .method:active { transform: scale(.97); }

  /* 2페이지: 납부 완료 */
  .done {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 0 72px;
  }
  .check {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--orange);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 28px rgba(243, 115, 33, .3);
    animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .check svg { width: 38px; height: 38px; }
  .check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .4s .25s ease forwards; }
  .done p { margin-top: 28px; font-size: 21px; font-weight: 700; line-height: 1.5; letter-spacing: -.025em; }

  /* 하단 틀 */
  .foot { height: 56px; margin: 0 24px; border-top: 1px solid var(--line); }

  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .check path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="logo.png" alt="한화손보"
         onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-text',textContent:'한화손보'}))">
  </header>

  <main>
    <!-- 1페이지: 미납 내역 안내 + 결제 방법 선택 -->
    <section id="step-pay" class="step is-active" aria-label="미납 보험료 결제">
      <p class="eyebrow">미납 보험료 납부</p>
      <h1>김영희 고객님,<br>미납 보험료를 확인하시고<br>결제를 진행해 주세요.</h1>

      <div class="card">
        <span class="badge">미납 계약</span>
        <h2 class="product">(무)시그니처<br>암보험</h2>
        <dl class="rows">
          <div><dt>계약자</dt><dd>김*희</dd></div>
          <div><dt>계약번호</dt><dd>LA9876****1098</dd></div>
          <div><dt>가입일</dt><dd>2022년 09월 15일</dd></div>
          <div><dt>계약 상태</dt><dd class="warn">2026년 11월 5일 당월 해지</dd></div>
          <div><dt>미납 내역</dt><dd>2026년 9월 · 10월분 2회</dd></div>
        </dl>
        <div class="total">
          <span>미납 금액</span>
          <strong>142,000<em>원</em></strong>
        </div>
      </div>

      <h3 class="section-title">결제 방법 선택</h3>
      <p class="section-sub">원하시는 결제 방법을 선택해 주세요.</p>
      <div class="methods">
        <button class="method" type="button" aria-label="카드 결제">
          <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
              <path d="M2.5 9.5h19"/>
              <path d="M6 15h4"/>
            </svg>
          </span>
          <span class="label">카드 결제</span>
        </button>
        <button class="method" type="button" aria-label="간편 결제(페이)">
          <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
              <path d="M10.5 18.5h3"/>
              <path d="M9.4 10.2l1.9 1.9 3.4-3.6"/>
            </svg>
          </span>
          <span class="label">간편 결제<br>(페이)</span>
        </button>
        <button class="method" type="button" aria-label="실시간 계좌이체">
          <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9.5L12 4l9 5.5"/>
              <path d="M5 10.5v7M9.7 10.5v7M14.3 10.5v7M19 10.5v7"/>
              <path d="M3 20h18"/>
            </svg>
          </span>
          <span class="label">실시간<br>계좌이체</span>
        </button>
      </div>
    </section>

    <!-- 2페이지: 납부 완료 -->
    <section id="step-done" class="step" aria-label="납부 완료" aria-live="polite">
      <div class="done">
        <div class="check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 12.5l4.2 4.2 8.8-9.2"/>
          </svg>
        </div>
        <p>고객님의 보험료 납입이<br>정상적으로 완료 되었습니다.</p>
      </div>
    </section>
  </main>

  <footer class="foot"></footer>
</div>

<script>
(function () {
  var payStep = document.getElementById('step-pay');
  var doneStep = document.getElementById('step-done');
  var busy = false;

  function show(step) {
    var done = step === 'done';
    payStep.classList.toggle('is-active', !done);
    doneStep.classList.toggle('is-active', done);
    window.scrollTo(0, 0);
  }

  // 새로고침하면 항상 1페이지부터 (시연 반복용)
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}

  // 어떤 결제 방법을 눌러도 결과는 동일: 납부 완료 화면으로 전환
  Array.prototype.forEach.call(document.querySelectorAll('.method'), function (btn) {
    btn.addEventListener('click', function () {
      if (busy) return;
      busy = true;
      btn.classList.add('is-selected');
      setTimeout(function () {
        try { history.pushState({ step: 'done' }, '', '#done'); } catch (e) {}
        show('done');
        btn.classList.remove('is-selected');
        busy = false;
      }, 280);
    });
  });

  // 브라우저 뒤로가기 → 1페이지로 복귀
  window.addEventListener('popstate', function () {
    show(location.hash === '#done' ? 'done' : 'pay');
  });
})();
</script>
</body>
</html>
